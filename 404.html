<!doctype html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#080c11">
  <title>404 — STUBER.WEB</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/global.css">
  <style>
    .error-page{min-height:100svh;display:grid;place-items:center;padding:2rem}
    .error-page__content{width:min(760px,100%);text-align:center}
    .error-page__code{display:block;margin-bottom:1rem;color:var(--color-accent);font:700 clamp(5rem,18vw,11rem)/.8 var(--font-display);letter-spacing:-.08em}
    .error-page h1{font-size:clamp(2rem,5vw,4rem);margin-bottom:1rem}
    .error-page p{max-width:560px;margin:0 auto 2rem;color:var(--color-text-secondary)}
    .error-page a{display:inline-flex;align-items:center;gap:.65rem;padding:.9rem 1.25rem;border-radius:var(--radius-full);background:var(--gradient-accent);color:var(--color-bg);font-weight:700}
  </style>
</head>
<body>
  <main class="error-page">
    <div class="error-page__content">
      <span class="error-page__code">404</span>
      <h1>Esta página no existe.</h1>
      <p>La dirección que buscás no está disponible o fue movida.</p>
      <a href="./">Volver al inicio <span aria-hidden="true">↗</span></a>
    </div>
  </main>
</body>
</html>
